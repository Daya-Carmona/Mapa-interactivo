<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Colombiana de Proyección Térmica - Mapa de miembros</title>
<style>
  :root {
    --ink: #16281f;
    --line: #2f6b4f;
    --line-light: #a9d3bd;
    --accent: #1f7a4d;
    --accent-dark: #14532d;
    --paper: #ffffff;
    --panel: #f6faf7;
    --muted: #5b6b62;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    margin-bottom: 20px;
    border-bottom: 2px solid var(--line-light);
    padding-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  /* ---- LOGO DE LA RED ----
     Reemplaza el contenido de #network-logo por tu logo real, por ejemplo:
     <img src="URL_O_ARCHIVO_DEL_LOGO.png" alt="Red Colombiana de Proyección Térmica">
     Si usas un archivo local, súbelo junto a este HTML y usa su nombre de archivo. */
  #network-logo {
    flex: 0 0 auto;
    width: 72px;
    height: 72px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line-light);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    overflow: hidden;
  }
  #network-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
  }
  header .header-text { flex: 1 1 auto; }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1.15fr) minmax(280px, 0.85fr);
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .map-card {
    background: var(--paper);
    border: 1px solid var(--line-light);
    border-radius: 10px;
    padding: 10px;
    position: sticky;
    top: 16px;
  }
  #map-viewport {
    position: relative;
    overflow: hidden;
    border-radius: 6px;
    cursor: grab;
    touch-action: none;
  }
  #map-viewport.dragging {
    cursor: grabbing;
  }
  .zoom-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .zoom-controls button {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--line-light);
    background: #fff;
    color: var(--accent-dark);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    line-height: 1;
  }
  .zoom-controls button:hover {
    background: var(--panel);
  }
  .zoom-controls button#zoom-reset {
    font-size: 0.95rem;
  }
  .zoom-hint {
    margin: 8px 4px 0;
    font-size: 0.75rem;
    color: var(--muted);
  }
  @media (max-width: 900px) {
    .map-card { position: static; }
  }
  svg#map {
    width: 100%;
    height: auto;
    display: block;
  }
  path.dept {
    fill: #eef7f0;
    stroke: var(--line);
    stroke-width: 1;
    stroke-linejoin: round;
    transition: fill 0.15s ease;
  }
  path.dept.highlight {
    fill: #cdead9;
  }
  .marker {
    cursor: pointer;
  }
  .marker circle {
    fill: var(--accent);
    stroke: #ffffff;
    stroke-width: 1.6;
    transition: fill 0.15s ease, r 0.15s ease;
  }
  .marker text {
    fill: #ffffff;
    font-size: 13px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    font-family: inherit;
  }
  .marker:hover circle, .marker.active circle {
    fill: var(--accent-dark);
    r: 17;
  }
  #tooltip {
    position: absolute;
    display: none;
    background: var(--accent-dark);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    white-space: nowrap;
    transform: translate(-50%, -130%);
    z-index: 10;
  }
  #tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--accent-dark);
  }

  .list-card {
    border: 1px solid var(--line-light);
    border-radius: 10px;
    overflow: hidden;
    background: var(--paper);
  }
  .list-header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line-light);
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  ul#entity-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 640px;
    overflow-y: auto;
  }
  ul#entity-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid #eef2ef;
    cursor: pointer;
    font-size: 0.88rem;
  }
  ul#entity-list li:hover {
    background: var(--panel);
  }
  ul#entity-list li.active {
    background: #e3f3e9;
  }
  .num-badge {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .entity-name {
    line-height: 1.25;
  }
  .entity-name .dept-tag {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 34, 24, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    max-width: 420px;
    width: 100%;
    padding: 26px 24px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    position: relative;
  }
  .modal .close-btn {
    position: absolute;
    top: 12px; right: 14px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .modal .close-btn:hover { color: var(--ink); }
  .logo-avatar {
    width: 72px; height: 72px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    margin-bottom: 14px;
    overflow: hidden;
    border: 1px solid var(--line-light);
  }
  .logo-avatar.has-logo {
    background: #fff;
  }
  .logo-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px;
  }
  .modal h2 {
    font-size: 1.15rem;
    margin: 0 0 4px;
  }
  .modal .modal-meta {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .modal .modal-desc {
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .modal .modal-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .modal .modal-link:hover { background: var(--accent-dark); }
  .modal .no-link {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div id="network-logo"><img src="Logotipos empresas y organizadores/Logo_red_colombiana_proyeccion_termica.jpeg" alt="Red Colombiana de Proyección Térmica"></div>
    <div class="header-text">
      <h1>Empresas e instituciones miembros de la Red Colombiana de Proyección Térmica</h1>
      <p>Haz clic en un número del mapa o en un elemento de la lista para ver su información.</p>
    </div>
  </header>
  <div class="layout">
    <div class="map-card">
      <div class="zoom-controls">
        <button id="zoom-in" title="Acercar">+</button>
        <button id="zoom-out" title="Alejar">&minus;</button>
        <button id="zoom-reset" title="Restablecer vista">⟲</button>
      </div>
      <div id="map-viewport">
        <svg id="map" viewBox="0 0 800 1094" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="tooltip"></div>
      <p class="zoom-hint">Usa la rueda del mouse o los botones para acercar, y arrastra para mover el mapa.</p>
    </div>
    <div class="list-card">
      <div class="list-header">Empresas e instituciones (18)</div>
      <ul id="entity-list"></ul>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close-btn" id="close-btn" aria-label="Cerrar">&times;</button>
    <div class="logo-avatar" id="modal-logo"></div>
    <h2 id="modal-name"></h2>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div id="modal-link-wrap"></div>
  </div>
</div>

const COMPANIES = [{"id": 1,"name": "Empresas Públicas de Medellín - EPM","dept": "Antioquia","city": "Medellín","lat": 6.2442,"lon": -75.5812,"website": "https://www.epm.com.co","logo": "Logotipos empresas y organizadores/Logo EPM sin fondo.tif","description": "Mediante HVOF aplicamos recubrimientos con carburo de tungsteno de hasta 0,6 mm de espesor sobre componentes de nuestras centrales Hidroeléctricas para protegerlos contra el desgaste extremo, la erosión por sedimentos del agua y la cavitación. Así mismo, mediante HVOF combinado con APS depositamos barreras térmicas para componentes de nuestras termoeléctricas, todos estos procesos apoyados por sistemas automatizados y robóticos de monitoreo y control que nos permite obtener recubrimientos de alta calidad que multiplican la vida útil de las piezas recubiertas. Ubicación: Cl. 30 # 65 - 315, Guayabal, Medellín, Antioquia Contacto: Ph.D. Pablo Andrés Gómez Correo: Pablo.Gomez@epm.com.co","initials": "EPM"},{"id": 2,"name": "Universidad Nacional de Colombia - Sede Medellín","dept": "Antioquia","city": "Medellín","lat": 6.261,"lon": -75.5786,"website": "https://medellin.unal.edu.co","logo": "Logotipos empresas y organizadores/Logo Unalmed sin fondo.tif","description": "Más de 15 años de experiencia realizando proyectos y servicios técnicos para la industria de la proyección térmica. Ofrecemos los siguientes servicios: Evaluación de Recubrimientos Composición Química y análisis de Fases Estructura (análisis de porosidad y otros defectos) Adherencia Dureza, módulo elástico y tenacidad a la fractura Evaluación de desempeño de recubrimientos (fatiga térmica, abrasión/erosión, ablación, corrosión) Proyectos para el desarrollo de Recubrimientos Ubicación: Cl 75 #78A-51, Pilarica, Robledo, Medellín, Antioquia. Contacto: Ph.D. Alejandro Toro Correo: aotoro@unal.edu.co Teléfono: 3123082152","initials": "UNAL"},{"id": 3,"name": "Universidad EAFIT","dept": "Antioquia","city": "Medellín","lat": 6.2006,"lon": -75.5783,"website": "https://www.eafit.edu.co","logo": "Logotipos empresas y organizadores/Logo EAFIT sin fondo.png","description": "Experiencia en temas relacionados con proyección térmica. Tenemos capacidades para apoyar los siguientes análisis: Análisis morfológico de partículas y microestructural de recubrimientos Simulación de procesos Asesoría y acompañamiento en proyectos de implementación de tecnologías de proyección térmica (beneficios tributarios, supervisión y ejecución de proyectos). Ubicación: Carrera 48 # 7Sur 50 Bloques 19 y 20 Campus Medellín, Antioquia Contacto: Ph.D. Claudia Constanza Palacio Espinosa Correo: cpalac12@eafit.edu.co Teléfono: 6042619500, 3104873704","initials": "EAFIT"},{"id": 4,"name": "Universidad de Antioquia","dept": "Antioquia","city": "Medellín","lat": 6.2676,"lon": -75.5686,"website": "https://www.udea.edu.co","logo": "Logotipos empresas y organizadores/Logo UdeA HR.png","description": "Más de 17 años de experiencia en la realización de proyectos en el área de la proyección térmica. Ofrecemos los siguientes servicios Análisis y procesamiento de polvos Composición química Análisis de fases Forma y distribución de tamaño de partículas Medida de la fluidez Aglomeración de partículas nano y submicrométricas Proyectos para el desarrollo de material particulado Evaluación de recubrimientos Composición química y análisis de fases Estructura (Análisis de porosidad y otras características) Adherencia Propiedades mecánicas (dureza, módulo elástico y tenacidad a la fractura) Resistencia al desgaste Proyectos para el desarrollo de recubrimientos Ubicación: Calle 67 # 53-108, Bloque 18-138, Medellín, Antioquia. Contacto: Ph.D. Fabio Vargas Galvis Correo: fabio.vargas@udea.edu.co Teléfono: (604)2198540-3006734027","initials": "UdeA"},{"id": 5,"name": "Metalizar Industrial S.A.S.","dept": "Antioquia","city": "Medellín","lat": 6.1719,"lon": -75.6122,"website": "https://www.linkedin.com/company/metalizar-s-a-s/?originalSubdomain=co","logo": "Logotipos empresas y organizadores/Logotipo Metalizar alta resolución.png","description": "Presta servicios de revestimiento y reparación de piezas industriales por termorrociado con equipos Flame Spray, Arc Spray y HVOF. Ubicación: Carrera 53 # 29c-25, zona industrial de Belén, Medellín, Antioquia. Contacto: Ing. Daniel Alejandro Serna Correo: daniel.serna@metalizar.co info@metalizar.co Teléfono: 6045579495 – 3157679133 – 3176416407","initials": "MI"},{"id": 6,"name": "ASTECO S.A.S.","dept": "Antioquia","city": "Medellín","lat": 6.185,"lon": -75.6,"website": "https://www.asteco.com.co","logo": "Logotipos empresas y organizadores/Logotipo ASTECO sin fondo.png","description": "En ASTECO S.A.S. (Asociación Técnica Comercial e Industrial) somos una compañía metalmecánica con más de ocho décadas de trayectoria, consolidada como un referente en soluciones integrales de ingeniería, comercialización de insumos industriales y formación especializada. A través de un enfoque de ventas consultivas respaldado por una sólida dirección en ingeniería, proveemos metales, herramientas y aleaciones de soldadura de alto desempeño para aplicaciones de mantenimiento y recubrimiento. Nuestra propuesta de valor se fundamenta en la consultoría experta en soldadura, recubrimientos protectores especiales, abarcando la elaboración y calificación de procedimientos (WPS), así como la homologación de soldadores bajo estrictos estándares internacionales. A través del Instituto ASTECO, capacitamos al talento del sector complementando nuestra operación con servicios rigurosos de inspección, análisis metalúrgico de fallas y diagnósticos de integridad, implementando estrategias de productividad avanzadas que optimizan los procesos de manufactura y mantenimiento de nuestros clientes tanto en planta como en campo. Ubicación: Cra. 54 #35-12, La Candelaria, Medellín, Antioquia. Contacto: Ing. Gabriel Jaime Jaramillo Correo: gjjaramillo@asteco.com.co Teléfono: 3148073059","initials": "AS"},{"id": 7,"name": "Ecosíntesis","dept": "Antioquia","city": "Medellín","lat": 6.208,"lon": -75.576,"website": "https://ecosintesis.co","logo": "Logotipos empresas y organizadores/Ecosíntesis.png","description": "Fundada en 2012, dedicada a la investigación, diseño, fabricación y comercialización de dispositivos médicos y biomateriales para el sector salud. Dentro de su portafolio se destacan los Clavos de Schanz recubiertos con hidroxiapatita, destinados a sistemas de fijación externa para el tratamiento de fracturas y otras patologías ortopédicas. Estos dispositivos son fabricados en acero inoxidable y cuentan con un recubrimiento superficial de hidroxiapatita de grado médico, aplicado mediante tecnología de proyección térmica por plasma. El recubrimiento bioactivo favorece la osteointegración y mejora la biocompatibilidad en el sitio de inserción ósea. Ecosintesis atiende principalmente el sector de dispositivos médicos, con énfasis en cirugía ortopédica y fijación ósea, y cuenta con certificación ISO 13485 para su sistema de gestión de calidad de dispositivos médicos.                                         Ubicación: Circular 5 # 69-34, Medellín. Contacto: Jairo Narváez. Correo: janamo_6@hotmail.com. Teléfono: +57 (604) 5901969 / 3006458543.","initials": "ECO"},{"id": 8,"name": "KST Soldadura y Metalurgia S.A.S.","dept": "Antioquia","city": "Medellín","lat": 6.245,"lon": -75.605,"website": "","logo": "Logotipos empresas y organizadores/KST SAS.png","description": "Suministro de equipos, partes y consumibles para proyección térmica y soldaduras especiales. Ubicación: Calle 56 # 78 A-117, Medellín, Antioquia. Contacto: Ing. Luis Alfredo Parra Correo: administracion@kstsas.com.co Teléfono: 3176564708","initials": "KST"},{"id": 9,"name": "REXCOTOOLS","dept": "Antioquia","city": "Envigado","lat": 6.17,"lon": -75.59,"website": "https://www.rexcotools.com","logo": "Logotipos empresas y organizadores/Rexco Tools HR.png","description": "Somos distribuidores autorizados para Colombia de la marca Oerlikon- function project(lon, lat) {
  const x = (lon - DEPT_DATA.minx) * DEPT_DATA.scale;
  const y = (DEPT_DATA.maxy - lat) * DEPT_DATA.scale;
  return [x, y];
}

const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${DEPT_DATA.width} ${DEPT_DATA.height}`);

// This group holds everything that should move/scale together when zooming or panning
const zoomGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
zoomGroup.setAttribute('id', 'zoom-group');
svg.appendChild(zoomGroup);

// Draw departments
const deptGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
for (const [name, d] of Object.entries(DEPT_DATA.departments)) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('class', 'dept');
  path.setAttribute('data-name', name);
  deptGroup.appendChild(path);
}
zoomGroup.appendChild(deptGroup);

// Draw markers
const markerGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const markerRefs = {};
const tooltip = document.getElementById('tooltip');
const mapCard = document.querySelector('.map-card');

for (const c of COMPANIES) {
  const [x, y] = project(c.lon, c.lat);
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'marker');
  g.setAttribute('data-id', c.id);
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', x);
  circle.setAttribute('cy', y);
  circle.setAttribute('r', 13);
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', x);
  text.setAttribute('y', y);
  text.textContent = c.id;
  g.appendChild(circle);
  g.appendChild(text);
  g.addEventListener('click', () => { if (!dragMoved) openModal(c.id); });
  g.addEventListener('mouseenter', (e) => showTooltip(e, c.name));
  g.addEventListener('mousemove', (e) => moveTooltip(e));
  g.addEventListener('mouseleave', hideTooltip);
  markerGroup.appendChild(g);
  markerRefs[c.id] = g;
}
zoomGroup.appendChild(markerGroup);

// ---- Zoom & pan ----
// The circles/text keep a constant on-screen size while zoomed by
// counter-scaling them, so numbers stay readable at any zoom level.
const viewport = document.getElementById('map-viewport');
const VBOX_W = DEPT_DATA.width;
const VBOX_H = DEPT_DATA.height;
const MIN_ZOOM = 1;
const MAX_ZOOM = 8;
let zoom = 1;
let panX = 0;
let panY = 0;

function applyTransform() {
  zoomGroup.setAttribute('transform', `translate(${panX} ${panY}) scale(${zoom})`);
  // Keep marker circles/text a legible, near-constant size regardless of zoom
  const counterScale = 1 / zoom;
  markerGroup.querySelectorAll('.marker').forEach(g => {
    const circle = g.querySelector('circle');
    const text = g.querySelector('text');
    const cx = parseFloat(circle.getAttribute('cx'));
    const cy = parseFloat(circle.getAttribute('cy'));
    g.setAttribute('transform', `translate(${cx} ${cy}) scale(${counterScale}) translate(${-cx} ${-cy})`);
  });
}

function clampPan() {
  // Prevent panning the map completely out of view
  const scaledW = VBOX_W * zoom;
  const scaledH = VBOX_H * zoom;
  const minX = Math.min(0, VBOX_W - scaledW);
  const minY = Math.min(0, VBOX_H - scaledH);
  panX = Math.max(minX, Math.min(0, panX));
  panY = Math.max(minY, Math.min(0, panY));
}

function zoomAt(factor, clientX, clientY) {
  const rect = viewport.getBoundingClientRect();
  // Point in viewBox coordinates under the cursor before zooming
  const px = (clientX - rect.left) / rect.width * VBOX_W;
  const py = (clientY - rect.top) / rect.height * VBOX_H;
  const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
  const actualFactor = newZoom / zoom;
  panX = px - (px - panX) * actualFactor;
  panY = py - (py - panY) * actualFactor;
  zoom = newZoom;
  clampPan();
  applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => {
  const rect = viewport.getBoundingClientRect();
  zoomAt(1.5, rect.left + rect.width / 2, rect.top + rect.height / 2);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  const rect = viewport.getBoundingClientRect();
  zoomAt(1 / 1.5, rect.left + rect.width / 2, rect.top + rect.height / 2);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  zoom = 1; panX = 0; panY = 0;
  applyTransform();
});

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });

// Drag to pan (mouse)
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let panStart = { x: 0, y: 0 };
let dragMoved = false;

viewport.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragMoved = false;
  viewport.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: panX, y: panY };
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = viewport.getBoundingClientRect();
  const dx = (e.clientX - dragStart.x) / rect.width * VBOX_W;
  const dy = (e.clientY - dragStart.y) / rect.height * VBOX_H;
  if (Math.abs(e.clientX - dragStart.x) > 4 || Math.abs(e.clientY - dragStart.y) > 4) {
    dragMoved = true;
  }
  panX = panStart.x + dx;
  panY = panStart.y + dy;
  clampPan();
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// Pinch to zoom + drag to pan (touch)
let touchState = null;
viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchState = { mode: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY, panStart: { x: panX, y: panY } };
  } else if (e.touches.length === 2) {
    const [t1, t2] = e.touches;
    touchState = {
      mode: 'pinch',
      dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
      midX: (t1.clientX + t2.clientX) / 2,
      midY: (t1.clientY + t2.clientY) / 2,
      zoomStart: zoom
    };
  }
}, { passive: true });

viewport.addEventListener('touchmove', (e) => {
  if (!touchState) return;
  e.preventDefault();
  if (touchState.mode === 'pan' && e.touches.length === 1) {
    const rect = viewport.getBoundingClientRect();
    const dx = (e.touches[0].clientX - touchState.x) / rect.width * VBOX_W;
    const dy = (e.touches[0].clientY - touchState.y) / rect.height * VBOX_H;
    panX = touchState.panStart.x + dx;
    panY = touchState.panStart.y + dy;
    clampPan();
    applyTransform();
  } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
    const [t1, t2] = e.touches;
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const factor = dist / touchState.dist;
    zoomAt(factor / (zoom / touchState.zoomStart), touchState.midX, touchState.midY);
  }
}, { passive: false });

viewport.addEventListener('touchend', () => { touchState = null; });

// Double-click to zoom in
viewport.addEventListener('dblclick', (e) => {
  zoomAt(1.6, e.clientX, e.clientY);
});

applyTransform();

function showTooltip(e, text) {
  tooltip.textContent = text;
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const rect = mapCard.getBoundingClientRect();
  tooltip.style.left = (e.clientX - rect.left) + 'px';
  tooltip.style.top = (e.clientY - rect.top) + 'px';
}
function hideTooltip() {
  tooltip.style.display = 'none';
}

// Build list
const listEl = document.getElementById('entity-list');
const listRefs = {};
for (const c of COMPANIES) {
  const li = document.createElement('li');
  li.setAttribute('data-id', c.id);
  li.innerHTML = `<span class="num-badge">${c.id}</span><span class="entity-name">${c.name}<span class="dept-tag">${c.city}, ${c.dept}</span></span>`;
  li.addEventListener('click', () => openModal(c.id));
  listEl.appendChild(li);
  listRefs[c.id] = li;
}

// Modal logic
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const modalLogo = document.getElementById('modal-logo');
const modalName = document.getElementById('modal-name');
const modalMeta = document.getElementById('modal-meta');
const modalDesc = document.getElementById('modal-desc');
const modalLinkWrap = document.getElementById('modal-link-wrap');
let currentActive = null;

function openModal(id) {
  const c = COMPANIES.find(x => x.id === id);
  if (!c) return;
  modalLogo.innerHTML = '';
  modalLogo.classList.toggle('has-logo', !!c.logo);
  if (c.logo) {
    const img = document.createElement('img');
    img.src = c.logo;
    img.alt = c.name;
    modalLogo.appendChild(img);
  } else {
    modalLogo.textContent = c.initials || c.name.slice(0,2).toUpperCase();
  }
  modalName.textContent = `${c.id}. ${c.name}`;
  modalMeta.textContent = `${c.city}, ${c.dept}`;
  modalDesc.textContent = c.description;
  modalLinkWrap.innerHTML = '';
  if (c.website) {
    const a = document.createElement('a');
    a.href = c.website;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'modal-link';
    a.textContent = 'Visitar sitio web ↗';
    modalLinkWrap.appendChild(a);
  } else {
    const span = document.createElement('span');
    span.className = 'no-link';
    span.textContent = 'Enlace no disponible todavía.';
    modalLinkWrap.appendChild(span);
  }
  overlay.classList.add('open');

  if (currentActive) {
    markerRefs[currentActive] && markerRefs[currentActive].classList.remove('active');
    listRefs[currentActive] && listRefs[currentActive].classList.remove('active');
  }
  markerRefs[id] && markerRefs[id].classList.add('active');
  listRefs[id] && listRefs[id].classList.add('active');
  currentActive = id;
}

function closeModal() {
  overlay.classList.remove('open');
}

document.getElementById('close-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
